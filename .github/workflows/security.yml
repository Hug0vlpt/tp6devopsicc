name: security

on:
  push:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 * * *"        # tous les jours à 5h
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit
      - run: bandit -r app -lll

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r app/requirements.txt --disable-pip --no-deps

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scan de tous l'historique
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (dependencies, secrets, misconfig)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build image
        run: docker build -t minishop:ci app/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: minishop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
